<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ARCHIVO VENCIMIENTO SUC 391 TRIUNVIRATO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/png" href="/static/logo.png">
    <style>
        /* Botones más grandes en móvil para facilitar el toque */
        @media (max-width: 576px) {
            .btn { min-height: 44px; }
            .btn-sm { font-size: 0.9rem; padding: 0.4rem 0.6rem; }
            .form-control { font-size: 1rem; }
            .form-label { font-size: 0.95rem; }
        }
        /* Separar los botones de la lista en móvil */
        .btns-lista {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: flex-end;
            margin-top: 6px;
        }
        .list-group-item { align-items: flex-start !important; flex-direction: column; }
        @media (min-width: 576px) {
            .list-group-item { flex-direction: row !important; }
            .btns-lista { margin-top: 0; }
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-3">
    <div class="text-center mb-2">
        <img src="/static/logo.png" alt="Logo" style="height:60px;">
    </div>
    <h1 class="text-center mb-4 text-primary text-uppercase fw-bold fs-5">ARCHIVO VENCIMIENTO SUC 391 TRIUNVIRATO 4207</h1>

    <div class="card p-3 mb-4 shadow-lg border-0">
        <h5 class="mb-3 text-success">➕ Agregar producto</h5>
        <div class="row g-3">

            <div class="col-12 col-md-3">
                <label class="form-label fw-semibold" for="codigo">Código</label>
                <input type="tel" id="codigo" inputmode="numeric" pattern="[0-9]*"
                       autocomplete="off" enterkeyhint="next"
                       class="form-control" placeholder="Código del producto" />
            </div>

            <div class="col-12 col-md-3">
                <label class="form-label fw-semibold" for="nombre">Nombre del artículo</label>
                <input type="search" id="nombre" list="articulos"
                       autocomplete="off" autocorrect="off" autocapitalize="none"
                       enterkeyhint="next"
                       class="form-control" placeholder="Escriba para buscar...">
                <datalist id="articulos"></datalist>
            </div>

            <div class="col-6 col-md-3">
                <label class="form-label fw-semibold" for="stock">Stock</label>
                <input type="tel" id="stock" inputmode="numeric" pattern="[0-9]*"
                       autocomplete="off" enterkeyhint="next"
                       class="form-control" placeholder="Cantidad">
            </div>

            <div class="col-6 col-md-3">
                <label class="form-label fw-semibold" for="fecha">Fecha vencimiento</label>
                <input type="date" id="fecha" autocomplete="off" enterkeyhint="done"
                       class="form-control">
            </div>
        </div>
        <button class="btn btn-success mt-3 w-100 fw-bold" onclick="agregarProducto()">
            ➕ Agregar producto
        </button>
    </div>

    <div class="card p-3 shadow-lg border-0">
        <h5 class="mb-3 text-warning">📋 Lista de productos</h5>
        <ul id="lista" class="list-group mb-3"></ul>
        <button class="btn btn-warning w-100 fw-bold" onclick="guardarLista()">
            💾 Guardar y descargar Excel
        </button>
    </div>

    <div id="mensaje" class="alert d-none mt-3" role="alert"></div>
</div>

<script>
/* ─── Utilidades ────────────────────────────────────────────────── */

function mostrarMensaje(texto, tipo = "info") {
    const msg = document.getElementById("mensaje");
    msg.className = `alert alert-${tipo}`;
    msg.textContent = texto;
    msg.classList.remove("d-none");
    // Scroll suave al mensaje para que sea visible en móvil
    msg.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/** Escapa caracteres HTML especiales para evitar XSS al insertar en innerHTML */
function escapeHtml(str) {
    return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

/* ─── Autocompletado con búsqueda en servidor (evita cargar 8000+ items) ── */

let _debounceTimer = null;

document.getElementById("nombre").addEventListener("input", function () {
    const q = this.value.trim();
    clearTimeout(_debounceTimer);
    if (q.length < 2) {
        document.getElementById("articulos").innerHTML = "";
        return;
    }
    _debounceTimer = setTimeout(async () => {
        try {
            const resp = await fetch(`/buscar_articulos?q=${encodeURIComponent(q)}`);
            if (!resp.ok) return;
            const items = await resp.json();
            const datalist = document.getElementById("articulos");
            // Usar createElement+textContent para evitar XSS en los valores
            datalist.innerHTML = "";
            items.forEach(a => {
                const opt = document.createElement("option");
                opt.value = a;
                datalist.appendChild(opt);
            });
        } catch (e) { /* ignore */ }
    }, 200);
});

/* ─── Cargar lista inicial desde el servidor ─────────────────────── */

async function cargarListaInicial() {
    try {
        const resp = await fetch("/lista");
        if (!resp.ok) return;
        const data = await resp.json();
        if (data.lista && data.lista.length > 0) renderLista(data.lista);
    } catch (e) {}
}
cargarListaInicial();

/* ─── Navegación con teclado (keydown para compatibilidad móvil) ─── */

function manejarEnterCodigo(e) {
    if (e.key !== "Enter") return;
    e.preventDefault();
    const cod = document.getElementById("codigo").value.trim();
    const nom = document.getElementById("nombre").value.trim();
    if (cod && nom) { mostrarMensaje("Ingresa SOLO código O nombre, no ambos", "warning"); return; }
    if (!cod && !nom) { mostrarMensaje("Ingresa código o nombre", "warning"); return; }
    document.getElementById("stock").focus();
}
function manejarEnterNombre(e) {
    if (e.key !== "Enter") return;
    e.preventDefault();
    const cod = document.getElementById("codigo").value.trim();
    const nom = document.getElementById("nombre").value.trim();
    if (cod && nom) { mostrarMensaje("Ingresa SOLO código O nombre, no ambos", "warning"); return; }
    if (!cod && !nom) { mostrarMensaje("Ingresa código o nombre", "warning"); return; }
    document.getElementById("stock").focus();
}

document.getElementById("codigo").addEventListener("keydown", manejarEnterCodigo);
document.getElementById("nombre").addEventListener("keydown", manejarEnterNombre);
document.getElementById("stock").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    e.preventDefault();
    document.getElementById("fecha").focus();
});
document.getElementById("fecha").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    e.preventDefault();
    agregarProducto();
});

/* Forzar solo dígitos en campos numéricos */
document.getElementById("codigo").addEventListener("input", function () {
    this.value = this.value.replace(/[^0-9]/g, "");
});
document.getElementById("stock").addEventListener("input", function () {
    this.value = this.value.replace(/[^0-9]/g, "");
});

/* ─── Agregar producto ───────────────────────────────────────────── */

async function agregarProducto() {
    const codigoVal = document.getElementById("codigo").value.trim();
    const nombreVal = document.getElementById("nombre").value.trim();
    const fechaVal  = document.getElementById("fecha").value;
    const stockVal  = document.getElementById("stock").value.trim() || null;

    if (codigoVal && nombreVal) {
        mostrarMensaje("Ingresa SOLO código O nombre, no ambos", "warning");
        return;
    }
    if (!codigoVal && !nombreVal) {
        mostrarMensaje("Ingresa código o nombre del producto", "warning");
        return;
    }
    if (!fechaVal) {
        mostrarMensaje("Ingresa la fecha de vencimiento", "warning");
        return;
    }

    try {
        const response = await fetch("/agregar_producto", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                codigo: codigoVal || null,
                descripcion: nombreVal || null,
                fecha_vencimiento: fechaVal,
                stock: stockVal
            })
        });
        const result = await response.json();
        if (result.lista) {
            renderLista(result.lista);
            mostrarMensaje("✅ Producto agregado correctamente", "success");
            document.getElementById("codigo").value = "";
            document.getElementById("nombre").value = "";
            document.getElementById("stock").value = "";
            document.getElementById("fecha").value = "";
            document.getElementById("articulos").innerHTML = "";
            document.getElementById("codigo").focus();
        } else {
            mostrarMensaje(result.detail || "Error al agregar producto", "danger");
        }
    } catch (e) {
        mostrarMensaje("Error de conexión al agregar producto", "danger");
    }
}

/* ─── Guardar lista en Excel ─────────────────────────────────────── */

async function guardarLista() {
    const cont = document.getElementById("lista");
    if (!cont || cont.children.length === 0) {
        mostrarMensaje("La lista está vacía. Agrega productos antes de guardar.", "warning");
        return;
    }
    try {
        const response = await fetch("/guardar_lista", { method: "POST" });
        if (response.ok) {
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "lista_final.xlsx";
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(url);
            mostrarMensaje("📂 Lista guardada y descargada", "success");
            return;
        }
        let detail = "";
        try { const j = await response.json(); detail = j.detail || j.mensaje || JSON.stringify(j); }
        catch (e) { detail = await response.text(); }
        mostrarMensaje(`Error al guardar la lista (${response.status}): ${detail}`, "danger");
    } catch (e) {
        mostrarMensaje("Error de conexión al guardar la lista", "danger");
    }
}

/* ─── Borrar producto ────────────────────────────────────────────── */

async function borrarProducto(codigo) {
    try {
        const response = await fetch(`/borrar_producto/${encodeURIComponent(codigo)}`, { method: "DELETE" });
        if (!response.ok) {
            let err = {};
            try { err = await response.json(); } catch (e) {}
            mostrarMensaje(err.detail || err.mensaje || "Error al eliminar producto", "danger");
            return;
        }
        const result = await response.json();
        renderLista(result.lista || []);
        mostrarMensaje(result.mensaje || "🗑️ Producto eliminado", "warning");
    } catch (e) {
        mostrarMensaje("Error al eliminar producto", "danger");
    }
}

/* ─── Renderizar lista ───────────────────────────────────────────── */

function buildItemContent(p) {
    const stockMostrado = (p.Stock !== undefined && p.Stock !== "") ? p.Stock : "-";
    // Construir el div de datos usando textContent para evitar XSS
    const dataDiv = document.createElement("div");
    dataDiv.className = "mb-1";
    dataDiv.innerHTML =
        `<strong>Código:</strong> <span class="val-codigo"></span> &nbsp;|&nbsp; ` +
        `<strong>Fecha:</strong> <span class="fecha"></span><br>` +
        `<strong>Descripción:</strong> <span class="val-desc"></span><br>` +
        `<strong>Stock:</strong> <span class="stock"></span>` +
        ` &nbsp;&nbsp;<strong>Estado:</strong> <span class="val-estado"></span>`;
    dataDiv.querySelector(".val-codigo").textContent = p.Codigo ?? "";
    dataDiv.querySelector(".fecha").textContent = p.FechaVencimiento ?? "";
    dataDiv.querySelector(".val-desc").textContent = p.Descripcion ?? "";
    dataDiv.querySelector(".stock").textContent = stockMostrado;
    dataDiv.querySelector(".val-estado").textContent = p.Estado ?? "";
    return dataDiv;
}

function buildButtons(codigo) {
    const btnsDiv = document.createElement("div");
    btnsDiv.className = "btns-lista";

    const btnMod = document.createElement("button");
    btnMod.className = "btn btn-secondary btn-sm btn-modificar";
    btnMod.textContent = "✏️ Modificar";
    btnMod.addEventListener("click", () => startEdit(codigo));

    const btnGuardar = document.createElement("button");
    btnGuardar.className = "btn btn-success btn-sm btn-guardar d-none";
    btnGuardar.textContent = "💾 Guardar";
    btnGuardar.addEventListener("click", () => saveEdit(codigo));

    const btnCancel = document.createElement("button");
    btnCancel.className = "btn btn-outline-secondary btn-sm btn-cancel d-none";
    btnCancel.textContent = "✖ Cancelar";
    btnCancel.addEventListener("click", () => cancelEdit(codigo));

    const btnBorrar = document.createElement("button");
    btnBorrar.className = "btn btn-danger btn-sm btn-borrar";
    btnBorrar.textContent = "🗑️ Borrar";
    btnBorrar.addEventListener("click", () => borrarProducto(codigo));

    btnsDiv.append(btnMod, btnGuardar, btnCancel, btnBorrar);
    return btnsDiv;
}

function renderLista(lista) {
    const contenedor = document.getElementById("lista");
    contenedor.innerHTML = "";
    if (!Array.isArray(lista)) return;
    lista.forEach(p => {
        const li = document.createElement("li");
        li.className = "list-group-item small";
        li.dataset.codigo = String(p.Codigo ?? "");
        li.appendChild(buildItemContent(p));
        li.appendChild(buildButtons(String(p.Codigo ?? "")));
        contenedor.appendChild(li);
    });
}

/* ─── Edición inline ─────────────────────────────────────────────── */

function startEdit(codigo) {
    const li = document.querySelector(`li[data-codigo="${codigo}"]`);
    if (!li) return;
    const spanFecha = li.querySelector(".fecha");
    const spanStock = li.querySelector(".stock");
    const currentFecha = spanFecha ? spanFecha.textContent.trim() : "";
    const currentStock = spanStock ? spanStock.textContent.trim().replace("-", "") : "";

    const inputFecha = document.createElement("input");
    inputFecha.type = "date";
    inputFecha.className = "form-control form-control-sm d-inline-block input-edit-fecha";
    inputFecha.style.width = "160px";
    inputFecha.value = currentFecha;
    spanFecha.replaceWith(inputFecha);

    const inputStock = document.createElement("input");
    inputStock.type = "tel";
    inputStock.inputMode = "numeric";
    inputStock.pattern = "[0-9]*";
    inputStock.className = "form-control form-control-sm d-inline-block input-edit-stock";
    inputStock.style.width = "80px";
    inputStock.value = currentStock;
    spanStock.replaceWith(inputStock);

    li.querySelectorAll(".btn-modificar").forEach(b => b.classList.add("d-none"));
    li.querySelectorAll(".btn-borrar").forEach(b => b.classList.add("d-none"));
    li.querySelectorAll(".btn-guardar").forEach(b => b.classList.remove("d-none"));
    li.querySelectorAll(".btn-cancel").forEach(b => b.classList.remove("d-none"));
    inputFecha.focus();
}

function cancelEdit() {
    cargarListaInicial();
}

async function saveEdit(codigo) {
    const li = document.querySelector(`li[data-codigo="${codigo}"]`);
    if (!li) return;
    const inputFecha = li.querySelector("input.input-edit-fecha");
    const inputStock = li.querySelector("input.input-edit-stock");
    if (!inputFecha) return;
    const nuevaFecha = inputFecha.value;
    if (!nuevaFecha) { mostrarMensaje("Ingrese una fecha válida", "warning"); return; }
    const nuevoStock = inputStock ? inputStock.value : null;
    try {
        const resp = await fetch(`/modificar_producto/${encodeURIComponent(codigo)}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ fecha_vencimiento: nuevaFecha, stock: nuevoStock || null })
        });
        if (!resp.ok) {
            let err = {};
            try { err = await resp.json(); } catch (e) {}
            mostrarMensaje(err.detail || err.mensaje || "Error al modificar producto", "danger");
            return;
        }
        const data = await resp.json();
        const updated = (data.lista || []).find(item => String(item.Codigo) === String(codigo));
        if (updated) {
            // Reconstruir el contenido del item de forma segura
            const oldDataDiv = li.querySelector("div");
            if (oldDataDiv) {
                const newDataDiv = buildItemContent(updated);
                oldDataDiv.replaceWith(newDataDiv);
            }
            li.querySelectorAll(".btn-guardar").forEach(b => b.classList.add("d-none"));
            li.querySelectorAll(".btn-cancel").forEach(b => b.classList.add("d-none"));
            li.querySelectorAll(".btn-modificar").forEach(b => b.classList.remove("d-none"));
            li.querySelectorAll(".btn-borrar").forEach(b => b.classList.remove("d-none"));
            mostrarMensaje(data.mensaje || "Producto modificado", "success");
        } else {
            renderLista(data.lista || []);
            mostrarMensaje(data.mensaje || "Producto modificado", "success");
        }
    } catch (e) {
        mostrarMensaje("Error al modificar producto", "danger");
    }
}
</script>

</body>
</html>
